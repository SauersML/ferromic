[build-system]
requires = ["maturin[patchelf]>=1.0,<2.0"]
build-backend = "maturin"

[project]
version = "0.1.4"
name = "ferromic"
requires-python = ">=3.9"
description = "Rust-accelerated population genetics toolkit with ergonomic Python bindings"
readme = "README.md"
authors = [{ name = "SauersML" }]
keywords = ["population-genetics", "bioinformatics", "rust", "pyo3", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
test = [
    "pytest",
    "numpy",
    "scikit-allel",
    "scipy",
    "pandas",
    "statsmodels",
    "pyarrow",
    "tqdm",
    "numba",
    "pytest-benchmark",
    "patchelf; platform_system == 'Linux'",
]
# recurrence/ pop-gen recurrence classifier. Fit + score + tests need only the
# scientific stack; msprime is required only to regenerate the training set
# (recurrence.cli simulate).
recurrence = [
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "pytest",
]
recurrence-sim = [
    "msprime>=1.2",
]

[tool.pytest.ini_options]
markers = [
    "timeout: mark tests to enforce a timeout",
]

[tool.maturin]
bindings = "pyo3"
profile = "release"
