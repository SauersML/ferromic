name: Generate supplementary tables

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas xlsxwriter tqdm

      - name: Download best tagging SNP results artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Never hard-fail on a missing/expired cross-workflow artifact: the canonical
          # data/best_tagging_snps_qvalues.tsv is committed in the repo (present from
          # checkout). Try to REFRESH it from the latest successful batch run, but fall back
          # to the committed copy. Only error if neither exists.
          set -uo pipefail
          mkdir -p data

          echo "Locating latest successful batch_best_tagging_snps.yml run ..."
          RUN_ID=$(gh run list --workflow batch_best_tagging_snps.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)

          if [[ -n "${RUN_ID:-}" ]] && gh run download "$RUN_ID" -n best-tagging-snps-results --dir data/best-tagging-snps-results 2>/dev/null; then
            CANDIDATE=""
            if [[ -f "data/best-tagging-snps-results/best_tagging_snps_qvalues.tsv" ]]; then
              CANDIDATE="data/best-tagging-snps-results/best_tagging_snps_qvalues.tsv"
            elif [[ -f "data/best-tagging-snps-results/data/best_tagging_snps_qvalues.tsv" ]]; then
              CANDIDATE="data/best-tagging-snps-results/data/best_tagging_snps_qvalues.tsv"
            fi
            if [[ -n "$CANDIDATE" ]]; then
              mv "$CANDIDATE" data/best_tagging_snps_qvalues.tsv
              echo "✓ Refreshed best_tagging_snps_qvalues.tsv from run $RUN_ID."
            else
              echo "::warning::Artifact downloaded but file not found in expected locations; using committed copy."
            fi
          else
            echo "::warning::No fresh best-tagging-snps-results artifact (missing/expired run); using committed data/best_tagging_snps_qvalues.tsv."
          fi

          if [[ ! -f data/best_tagging_snps_qvalues.tsv ]]; then
            echo "::error::No best_tagging_snps_qvalues.tsv available (neither a fresh artifact nor a committed copy)."
            exit 1
          fi
          echo "Using best_tagging_snps_qvalues.tsv ($(wc -l < data/best_tagging_snps_qvalues.tsv) lines)."

      - name: Generate supplementary tables workbook
        run: |
          python stats/generate_tables.py --output web/figures-site/public/downloads/supplementary_tables.xlsx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload supplementary tables artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplementary-tables
          path: web/figures-site/public/downloads/supplementary_tables.xlsx
          if-no-files-found: error

      # Journal "Supplemental Code": everything needed to reproduce the work.
      # Two parts, because the analysis spans two repositories:
      #   ferromic/    this repository, every tracked code file, no data
      #   inversionSimulation/  the upstream structured-coalescent simulation and
      #                recurrence-inference code that the manuscript cites and that
      #                simulations/refsim ports. Without it the recurrence analysis
      #                is not reproducible from this archive alone.
      # Built from git ls-files so the ferromic half is a pure function of the commit.
      - name: Build Supplemental Code archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf supplemental_code && mkdir -p supplemental_code/ferromic

          # --- this repository -------------------------------------------------
          git ls-files -z -- \
            '*.py' '*.rs' '*.R' '*.sh' '*.sbatch' '*.slim' '*.pl' \
            '*.toml' '*.cfg' '*.mk' 'Makefile' '*/Makefile' \
            'Snakefile' '*/Snakefile' '*.smk' \
            'README*' '*/README*' 'LICENSE*' \
            '.github/workflows/*.yml' 'simulations/*.json' \
            ':!:web' ':!:data' ':!:tmp' ':!:out' ':!:results' \
            | tar --null -T - -cf - \
            | tar -xf - -C supplemental_code/ferromic
          n_ferromic=$(find supplemental_code/ferromic -type f | wc -l)
          echo "ferromic: $n_ferromic files"

          # --- upstream simulation code ---------------------------------------
          # Cited in the manuscript as the source of the recurrence inference.
          if git clone --depth 1 https://github.com/hsiehphLab/inversionSimulation.git \
                 supplemental_code/inversionSimulation 2>/dev/null; then
            up_sha=$(git -C supplemental_code/inversionSimulation rev-parse HEAD)
            rm -rf supplemental_code/inversionSimulation/.git
            n_up=$(find supplemental_code/inversionSimulation -type f | wc -l)
            echo "inversionSimulation: $n_up files at $up_sha"
          else
            up_sha="unavailable"; n_up=0
            echo "::warning::could not clone hsiehphLab/inversionSimulation; the archive will note its absence"
            mkdir -p supplemental_code/inversionSimulation
            echo "Clone https://github.com/hsiehphLab/inversionSimulation for the structured-coalescent simulation and recurrence-inference code." \
              > supplemental_code/inversionSimulation/SEE_UPSTREAM.txt
          fi

          # --- manifest --------------------------------------------------------
          {
            echo "Supplemental Code"
            echo "================="
            echo
            echo "Built from ${GITHUB_REPOSITORY:-SauersML/ferromic} at commit ${GITHUB_SHA:-local}"
            echo "on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "ferromic/  ($n_ferromic files)"
            echo "    All code for the population-genetic, coding-sequence, selection and"
            echo "    phenome-wide analyses, plus the GitHub Actions workflows that run them."
            echo "    Data files are deliberately excluded; every committed table is"
            echo "    regenerated by these workflows from the sources listed in Methods."
            echo "      src/            Rust: pi, FST, dxy and the per-CDS alignment writer"
            echo "      stats/          Python: every statistical analysis and figure"
            echo "      simulations/    coalescent and forward simulations"
            echo "      imputation/     inversion genotype imputation"
            echo "      phewas/         association analysis"
            echo "      cds/            coding-sequence pipeline"
            echo "      .github/workflows/  the pipelines that reproduce the committed outputs"
            echo
            echo "inversionSimulation/  ($n_up files, upstream commit $up_sha)"
            echo "    The structured-coalescent simulation and recurrence-inference code of"
            echo "    Porubsky et al. (2022), cited in Methods. simulations/refsim in this"
            echo "    repository ports it so that its power and false-positive rate could be"
            echo "    measured; the original is included here so both can be run."
            echo
            echo "Live repository: https://github.com/SauersML/ferromic"
            echo "Upstream:        https://github.com/hsiehphLab/inversionSimulation"
          } > supplemental_code/MANIFEST.txt

          zip -q -r supplemental_code.zip supplemental_code
          echo "archive: $(du -h supplemental_code.zip | cut -f1), $(unzip -l supplemental_code.zip | tail -1)"

      - name: Upload Supplemental Code artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-code
          path: supplemental_code.zip
          if-no-files-found: error
