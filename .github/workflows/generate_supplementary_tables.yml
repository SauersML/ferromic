name: Generate supplementary tables

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: supplementary-tables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 xlsxwriter==3.2.5 tqdm==4.67.1

      - name: Verify canonical committed inputs
        run: |
          set -euo pipefail
          test -s data/best_tagging_snps_qvalues.tsv
          test -s data/imputation_results_merged.tsv
          test -s data/per_gene_cds_permutation.tsv
          test -s data/cds_permutation_joint_control.tsv
          test -s simulations/refsim/gene_flux_summary.tsv

      - name: Verify and export final supplementary ordering
        run: |
          python stats/verify_supplementary_inventory.py \
            --write-tsv web/figures-site/public/downloads/supplementary_inventory.tsv

      - name: Generate supplementary tables workbook
        run: python stats/generate_tables.py --output web/figures-site/public/downloads/supplementary_tables.xlsx

      - name: Independently verify the exported workbook
        run: |
          python stats/verify_supplementary_workbook.py \
            web/figures-site/public/downloads/supplementary_tables.xlsx
          python stats/verify_supplementary_inventory.py

      - name: Commit the regenerated workbook to the repository
        if: github.event_name != 'pull_request'
        env:
          PUSH_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The workbook is a build output and is listed in .gitignore, so it is
          # force-added.  Committing it means a checkout always carries the
          # workbook that matches its own commit, instead of the authors having
          # to find the right expiring Actions artifact.
          files=(
            web/figures-site/public/downloads/supplementary_tables.xlsx
            web/figures-site/public/downloads/supplementary_inventory.tsv
          )
          for f in "${files[@]}"; do
            test -f "$f"
            git add -f -- "$f"
          done

          if git diff --staged --quiet; then
            echo "Workbook unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Regenerate supplementary tables workbook [skip ci]"
          git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
            --rebase --autostash --strategy=recursive -X ours

          for attempt in 1 2 3; do
            if git push https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt); refreshing and retrying"
            git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
              --rebase --autostash --strategy=recursive -X ours
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Upload supplementary tables artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplementary-tables
          path: |
            web/figures-site/public/downloads/supplementary_tables.xlsx
            web/figures-site/public/downloads/supplementary_inventory.tsv
          if-no-files-found: error

      # Journal "Supplemental Code": everything needed to reproduce the work.
      # Two parts, because the analysis spans two repositories:
      #   ferromic/    this repository, every tracked code file, no data
      #   inversionSimulation/  the upstream structured-coalescent simulation and
      #                recurrence-inference code that the manuscript cites and that
      #                simulations/refsim ports. Without it the recurrence analysis
      #                is not reproducible from this archive alone.
      # Built from git ls-files so the ferromic half is a pure function of the commit.
      - name: Build Supplemental Code archive
        run: |
          set -euo pipefail
          rm -rf supplemental_code && mkdir -p supplemental_code/ferromic

          # --- this repository -------------------------------------------------
          git ls-files -z -- \
            '*.py' '*.rs' '*.R' '*.sh' '*.sbatch' '*.slim' '*.pl' \
            '*.toml' '*.cfg' '*.mk' 'Makefile' '*/Makefile' \
            'Snakefile' '*/Snakefile' '*.smk' \
            'README*' '*/README*' 'LICENSE*' \
            '.github/workflows/*.yml' 'simulations/*.json' \
            ':!:web' ':!:data' ':!:tmp' ':!:out' ':!:results' \
            | tar --null -T - -cf - \
            | tar -xf - -C supplemental_code/ferromic
          n_ferromic=$(find supplemental_code/ferromic -type f | wc -l)
          echo "ferromic: $n_ferromic files"

          # --- latest upstream simulation code -------------------------------
          # Resolve main once, then fetch that exact commit so the archive records
          # what "latest" meant for this workflow run.
          mkdir -p supplemental_code/inversionSimulation
          up_sha="$(git ls-remote https://github.com/hsiehphLab/inversionSimulation.git refs/heads/main | awk '{print $1}')"
          [[ "$up_sha" =~ ^[0-9a-f]{40}$ ]]
          up_archive="$RUNNER_TEMP/inversionSimulation-${up_sha}.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/hsiehphLab/inversionSimulation/archive/${up_sha}.tar.gz" \
            --output "$up_archive"
          up_archive_sha256="$(sha256sum "$up_archive" | awk '{print $1}')"
          tar -xzf "$up_archive" \
            --strip-components=1 \
            -C supplemental_code/inversionSimulation
          n_up=$(find supplemental_code/inversionSimulation -type f | wc -l)
          test "$n_up" -gt 0
          echo "inversionSimulation: $n_up files from main at $up_sha"
          echo "archive SHA-256: $up_archive_sha256"

          # --- manifest --------------------------------------------------------
          {
            echo "Supplemental Code"
            echo "================="
            echo
            echo "Built from ${GITHUB_REPOSITORY:-SauersML/ferromic} at commit ${GITHUB_SHA:-local}"
            echo "on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "ferromic/  ($n_ferromic files)"
            echo "    All code for the population-genetic, coding-sequence, selection and"
            echo "    phenome-wide analyses, plus the GitHub Actions workflows that run them."
            echo "    Data files are deliberately excluded; every committed table is"
            echo "    regenerated by these workflows from the sources listed in Methods."
            echo "      src/            Rust: pi, FST, dxy and the per-CDS alignment writer"
            echo "      stats/          Python: every statistical analysis and figure"
            echo "      simulations/    coalescent and forward simulations"
            echo "      imputation/     inversion genotype imputation"
            echo "      phewas/         association analysis"
            echo "      cds/            coding-sequence pipeline"
            echo "      .github/workflows/  the pipelines that reproduce the committed outputs"
            echo
            echo "inversionSimulation/  ($n_up files)"
            echo "    Source ref: main"
            echo "    Resolved upstream commit: $up_sha"
            echo "    Downloaded archive SHA-256: $up_archive_sha256"
            echo "    The structured-coalescent simulation and recurrence-inference code of"
            echo "    Porubsky et al. (2022), cited in Methods. simulations/refsim in this"
            echo "    repository ports it so that its power and false-positive rate could be"
            echo "    measured; the original is included here so both can be run."
            echo
            echo "Live repository: https://github.com/SauersML/ferromic"
            echo "Upstream:        https://github.com/hsiehphLab/inversionSimulation"
          } > supplemental_code/MANIFEST.txt

          zip -q -r supplemental_code.zip supplemental_code
          echo "archive: $(du -h supplemental_code.zip | cut -f1), $(unzip -l supplemental_code.zip | tail -1)"

      - name: Upload Supplemental Code artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-code
          path: supplemental_code.zip
          if-no-files-found: error
