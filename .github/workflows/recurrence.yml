name: Recurrence classifier tests

on:
  push:
    paths:
      - 'recurrence/**'
      - '.github/workflows/recurrence.yml'
  pull_request:
    paths:
      - 'recurrence/**'
      - '.github/workflows/recurrence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recurrence test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.23" "scipy>=1.10" "scikit-learn>=1.2" "pandas>=2.0" pytest
      - name: Run reproduction / QC tests
        run: pytest recurrence/tests -q
