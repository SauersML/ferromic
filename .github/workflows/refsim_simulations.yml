name: Reference Recurrence Simulations

# Runs the full reference recurrence pipeline (simulations/refsim) in CI and
# commits the regenerated tables. This is the coalescent work that used to be
# cluster-only: it is sharded across a matrix so each runner does a slice, then a
# single aggregation job merges, refits, and pushes.
#
# Cost per task (2-core runner, --procs 2):
#   flux      5,400 loci / 20 shards = 270 each  ~15-25 min
#   trainset 11,250 loci / 20 shards = 563 each  ~10-15 min
#   extreme   1,200 loci / 20 shards =  60 each  ~5 min
#
# Not run on push -- this is heavy. Trigger it explicitly, or on a change to the
# pipeline itself.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Comma-separated grids to run (flux,trainset,extreme)'
        default: 'flux,trainset,extreme'
      commit:
        description: 'Commit regenerated results back to main'
        type: boolean
        default: true
      reps:
        description: 'Replicates per grid cell. Leave blank for the real grid. Any
          value here marks the run as a VALIDATION run: results are uploaded as
          artifacts only, and aggregation and commit are skipped so a cheap smoke
          test can never overwrite the committed full-grid tables.'
        default: ''
      nshards:
        description: 'Shards to split across (default 20)'
        default: '20'
  push:
    branches: [main]
    paths:
      # Only the code that actually generates replicates. make_report.py just
      # aggregates committed shards, so editing it must not launch a 60-job
      # simulation -- doing so once saturated the runner limit and left every
      # other workflow queued for hours.
      - 'simulations/refsim/refsim.py'
      - 'simulations/refsim/run_grid.py'

concurrency:
  group: refsim-${{ github.ref }}
  cancel-in-progress: true

env:
  IQTREE_VERSION: 2.2.2.7
  NSHARDS: ${{ github.event.inputs.nshards || '20' }}
  REPS: ${{ github.event.inputs.reps || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        run: |
          set -euo pipefail
          tasks="${{ github.event.inputs.tasks || 'flux,trainset,extreme' }}"
          python3 - "$tasks" "${NSHARDS}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          tasks = [t.strip() for t in sys.argv[1].split(",") if t.strip()]
          n = int(sys.argv[2])
          include = [{"task": t, "shard": s} for t in tasks for s in range(n)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  simulate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Capped below the account's concurrent-runner limit so this workflow
      # cannot starve the others while it runs.
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install msprime biopython numpy pandas scipy scikit-learn

      - name: Install IQ-TREE 2
        run: |
          set -euo pipefail
          url="https://github.com/iqtree/iqtree2/releases/download/v${IQTREE_VERSION}/iqtree-${IQTREE_VERSION}-Linux.tar.gz"
          curl -fsSL "$url" -o /tmp/iqtree.tar.gz
          tar -xzf /tmp/iqtree.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/iqtree-${IQTREE_VERSION}-Linux/bin/iqtree2" /usr/local/bin/iqtree2
          iqtree2 --version | head -1

      - name: Run shard
        env:
          PYTHONPATH: ${{ github.workspace }}
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          mkdir -p out
          reps_arg=""
          if [ -n "${REPS}" ]; then
            reps_arg="--reps ${REPS}"
            echo "VALIDATION RUN: --reps ${REPS}; results will not be aggregated or committed"
          fi
          python simulations/refsim/run_grid.py \
            --task "${{ matrix.task }}" \
            --shard "${{ matrix.shard }}" --nshards "${NSHARDS}" \
            --procs "$(nproc)" $reps_arg \
            --out "out/${{ matrix.task }}_shard${{ matrix.shard }}.csv"

      - uses: actions/upload-artifact@v4
        with:
          name: refsim-${{ matrix.task }}-${{ matrix.shard }}
          path: out/*.csv
          retention-days: 5

  aggregate:
    needs: simulate
    if: always() && needs.simulate.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib

      - uses: actions/download-artifact@v4
        with:
          pattern: refsim-*
          merge-multiple: true
          path: simulations/refsim/out

      - name: Show what landed
        run: |
          ls -la simulations/refsim/out/ || true
          for t in flux trainset extreme; do
            n=$(ls simulations/refsim/out/${t}_shard*.csv 2>/dev/null | wc -l)
            echo "$t: $n / ${NSHARDS} shards"
          done

      - name: Aggregate the flux and extreme sweeps
        if: github.event.inputs.reps == ''
        working-directory: simulations/refsim
        run: |
          set -euo pipefail
          shopt -s nullglob
          flux=(out/flux_shard*.csv); extreme=(out/extreme_shard*.csv)
          if [ ${#flux[@]} -eq "${NSHARDS}" ]; then
            python make_report.py 'out/flux_shard*.csv' --prefix flux
          else
            echo "flux incomplete (${#flux[@]}/${NSHARDS}) -- not regenerating its tables"
          fi
          if [ ${#extreme[@]} -eq "${NSHARDS}" ]; then
            python make_report.py 'out/extreme_shard*.csv' --prefix extreme
          else
            echo "extreme incomplete (${#extreme[@]}/${NSHARDS}) -- not regenerating its tables"
          fi

      - name: Rebuild the training set, then refit and rescore
        if: github.event.inputs.reps == ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          tr=(simulations/refsim/out/trainset_shard*.csv)
          if [ ${#tr[@]} -ne "${NSHARDS}" ]; then
            echo "trainset incomplete (${#tr[@]}/${NSHARDS}) -- skipping refit"
            exit 0
          fi
          python -m recurrence.cli simulate --merge 'simulations/refsim/out/trainset_shard*.csv'
          gzip -t recurrence/data/sim_features.csv.gz
          python -m recurrence.cli fit
          python -m recurrence.cli score

      - name: Verify every tracked gzip still decompresses
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.gz'); do
            gzip -t "$f" || { echo "corrupt gzip: $f"; exit 1; }
          done
          echo "all tracked gzip files intact"

      - name: Commit regenerated simulation results
        if: >-
          github.event_name != 'pull_request'
          && github.event.inputs.commit != 'false'
          && github.event.inputs.reps == ''
        env:
          PUSH_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            simulations/refsim/flux_results.csv
            simulations/refsim/flux_results.md
            simulations/refsim/sweep_flux.json
            simulations/refsim/extreme_results.csv
            simulations/refsim/extreme_results.md
            simulations/refsim/sweep_extreme.json
            recurrence/data/sim_features.csv.gz
            recurrence/results/model.json
            recurrence/results/transferable_model.json
            recurrence/results/sim_metrics.json
            recurrence/results/tf_sim_metrics.json
            recurrence/results/sim_test_pred.csv.gz
            recurrence/results/tf_sim_test_pred.csv.gz
            recurrence/results/fit_provenance.json
            recurrence/results/score_provenance.json
            recurrence/results/real_scores.csv
            recurrence/results/concordance.json
            recurrence/results/concordance_disagreements.csv
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] && git add -- "$f" || echo "missing (skipped): $f"
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Regenerate reference recurrence simulations [skip ci]"
          git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
            --rebase --autostash --strategy=recursive -X ours
          for attempt in 1 2 3; do
            if git push https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main; then
              echo "Push succeeded on attempt $attempt"; exit 0
            fi
            git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
              --rebase --autostash --strategy=recursive -X ours
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refsim-aggregated
          path: |
            simulations/refsim/*_results.csv
            simulations/refsim/*_results.md
            simulations/refsim/sweep_*.json
            simulations/refsim/*.png
            recurrence/results/*.json
          if-no-files-found: warn
