name: Reference Recurrence Simulations

# Runs the complete reported gene-flux grid in CI and commits its regenerated
# tables. This is the coalescent work that used to be cluster-only: it is sharded
# across a matrix so each runner does a slice, then a single aggregation job
# validates the exact grid, summarizes it, and pushes.
#
# Cost, MEASURED rather than guessed. A GitHub 2-core runner takes >50 s per
# 240-haplotype locus, against ~7 s/locus on a 128-core MSI node -- IQ-TREE on a
# 200 kbp alignment does not fit a small runner well. So:
#
#   fluxsweep3 11,520 loci / 64 shards = 180 each (the reported analysis)
#
# An earlier version of this comment claimed 15-25 min per flux shard; that was
# extrapolated from MSI timings and was wrong by roughly an order of magnitude.
#
# This workflow is therefore the *reproducibility* path, not the routine one: it
# proves the pipeline runs end to end from a clean checkout with no cluster. For
# actually regenerating the grids, a cluster is far cheaper -- see
# simulations/refsim/refsim.sbatch. Use the `reps` input for a cheap smoke test.
#
# Not run on push except when the simulation code itself changes.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit regenerated results back to main'
        type: boolean
        default: true
      reps:
        description: 'Replicates per grid cell. Leave blank for the real grid. Any
          value here marks the run as a VALIDATION run: results are uploaded as
          artifacts only, and aggregation and commit are skipped so a cheap smoke
          test can never overwrite the committed full-grid tables.'
        default: ''
      nshards:
        description: 'Shards to split across (default 64)'
        default: '64'
concurrency:
  group: refsim-${{ github.ref }}
  cancel-in-progress: true

env:
  IQTREE_VERSION: 2.1.2
  TASK: fluxsweep3
  NSHARDS: ${{ github.event.inputs.nshards || '64' }}
  REPS: ${{ github.event.inputs.reps || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        run: |
          set -euo pipefail
          python3 - "${TASK}" "${NSHARDS}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          task = sys.argv[1]
          n = int(sys.argv[2])
          include = [{"task": task, "shard": s} for s in range(n)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  simulate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Capped below the account's concurrent-runner limit so this workflow
      # cannot starve the others while it runs.
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable upstream simulation source
        run: |
          set -euo pipefail
          python scripts/fetch_manuscript_sources.py \
            --source inversion_simulation_upstream \
            --output-dir /tmp/manuscript-sources
          mkdir -p /tmp/inversion-simulation-upstream
          tar -xzf /tmp/manuscript-sources/inversionSimulation-3f845a2b4e017842d1d6648210f148faab616e17.tar.gz \
            -C /tmp/inversion-simulation-upstream
          cmp simulations/refsim/inputFiles/temp.fa \
            /tmp/inversion-simulation-upstream/inversionSimulation-3f845a2b4e017842d1d6648210f148faab616e17/inputFiles/temp.fa

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement simulations/refsim/requirements.txt

      - name: Install IQ-TREE 2
        run: |
          set -euo pipefail
          url="https://github.com/iqtree/iqtree2/releases/download/v${IQTREE_VERSION}/iqtree-${IQTREE_VERSION}-Linux.tar.gz"
          curl -fsSL "$url" -o /tmp/iqtree.tar.gz
          echo "4ad515deb95af9eeef1df949eaa41399cff24cd90077e0136cce66f0a63cc99f  /tmp/iqtree.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/iqtree.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/iqtree-${IQTREE_VERSION}-Linux/bin/iqtree2" /usr/local/bin/iqtree2
          iqtree2 --version | head -1

      - name: Run shard
        env:
          PYTHONPATH: ${{ github.workspace }}
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          mkdir -p out
          reps_arg=""
          if [ -n "${REPS}" ]; then
            reps_arg="--reps ${REPS}"
            echo "VALIDATION RUN: --reps ${REPS}; results will not be aggregated or committed"
          fi
          python simulations/refsim/run_grid.py \
            --task "${{ matrix.task }}" \
            --shard "${{ matrix.shard }}" --nshards "${NSHARDS}" \
            --procs "$(nproc)" $reps_arg \
            --out "out/${{ matrix.task }}_shard${{ matrix.shard }}.csv"

      - uses: actions/upload-artifact@v4
        with:
          name: refsim-${{ matrix.task }}-${{ matrix.shard }}
          path: out/*.csv
          retention-days: 5

  aggregate:
    needs: simulate
    if: needs.simulate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement simulations/refsim/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: refsim-*
          merge-multiple: true
          path: simulations/refsim/out

      - name: Show what landed
        run: |
          ls -la simulations/refsim/out/ || true
          n=$(find simulations/refsim/out -name "${TASK}_shard*.csv" | wc -l)
          echo "${TASK}: $n / ${NSHARDS} shards"

      - name: Validate the complete selected simulation grid
        if: github.event.inputs.reps == ''
        working-directory: simulations/refsim
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(out/${TASK}_shard*.csv)
          test ${#shards[@]} -eq "${NSHARDS}" || {
            echo "${TASK} incomplete (${#shards[@]}/${NSHARDS})"; exit 1;
          }
          python validate_grid.py --task "${TASK}" \
            --inputs "out/${TASK}_shard*.csv" \
            --provenance fluxsweep_provenance.json

      - name: Rebuild and assert the reported gene-flux results
        if: github.event.inputs.reps == ''
        working-directory: simulations/refsim
        run: |
          set -euo pipefail
          python make_report.py 'out/fluxsweep3_shard*.csv' \
            --prefix gene_flux
          python verify_reported_flux.py \
            --rows 'out/fluxsweep3_shard*.csv'

      - name: Verify every tracked gzip still decompresses
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.gz'); do
            gzip -t "$f" || { echo "corrupt gzip: $f"; exit 1; }
          done
          echo "all tracked gzip files intact"

      - name: Commit regenerated simulation results
        if: >-
          github.event_name != 'pull_request'
          && github.event.inputs.commit != 'false'
          && github.event.inputs.reps == ''
        env:
          PUSH_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(simulations/refsim/gene_flux_results.csv
                 simulations/refsim/gene_flux_results.md
                 simulations/refsim/sweep_gene_flux.json
                 simulations/refsim/fluxsweep_provenance.json)
          figures=(simulations/refsim/gene_flux_fpr_power.png)
          for f in "${files[@]}"; do
            test -f "$f"
            git add -- "$f"
          done
          for f in "${figures[@]}"; do
            test -f "$f"
            git add -f -- "$f"
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Regenerate reference recurrence simulations [skip ci]"
          git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
            --rebase --autostash --strategy=recursive -X ours
          for attempt in 1 2 3; do
            if git push https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main; then
              echo "Push succeeded on attempt $attempt"; exit 0
            fi
            git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
              --rebase --autostash --strategy=recursive -X ours
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refsim-aggregated
          path: |
            simulations/refsim/*_results.csv
            simulations/refsim/*_results.md
            simulations/refsim/*_provenance.json
            simulations/refsim/sweep_*.json
            simulations/refsim/*.png
          if-no-files-found: error
