name: Assemble supplementary materials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble_supplementary_materials.yml'
      - 'reproducibility/templates/INV_MS_SupplementaryMaterials_v3.8.final.docx'
      - 'reproducibility/manuscript_sources.json'
      - 'scripts/assemble_supplementary_materials.py'
      - 'scripts/export_manuscript_figures.py'
      - 'scripts/annotate_main_figure_2a.py'
      - 'scripts/replace_main_figure_3b.py'
      - 'stats/main_figure_3b.py'
      - 'data/cds_permutation_joint_control.tsv'
      - 'data/per_gene_cds_permutation.tsv'
      - 'scripts/verify_assembled_supplement.py'
      - 'stats/supplementary_inventory.py'
      - 'stats/verify_supplementary_inventory.py'
      - 'stats/svbyeye_supplement.py'
      - 'svbyeye/bin/plot_chimp_hires.R'
      - 'stats/four_fold_pi.py'
      - 'stats/recurrence_sd_figure.py'
      - 'stats/divergence_da_dxy_by_type.py'
      - 'stats/figure2a_repolarized.py'
      - 'stats/imputation_benchmark_figure.py'
      - 'stats/phewas_within_ancestry_figures.py'
      - 'data/four_fold_pi_by_inversion.tsv'
      - 'data/recurrence_sd_calls.tsv'
      - 'data/recurrence_sd_summary.tsv'
      - 'data/output.csv'
      - 'data/chimp_alignment_responses.json'
      - 'data/inv_properties.tsv'
      - 'data/imputation_benchmark_HsInv0284.tsv'
      - 'data/imputation_benchmark_HsInv0284_summary.tsv'
      - 'data/phewas_results.tsv'
      - 'data/within_ancestry_pc_phewas_results.tsv'
      - 'simulations/refsim/make_demography_fig.py'
      - 'simulations/refsim/refsim.py'
      - 'simulations/refsim/gene_flux_fpr_power.png'
      - 'simulations/refsim/gene_flux_fpr_power.pdf'
      - 'output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.png'
      - 'output/pdf/svbyeye/Supplemental_File_SVbyEye_consensus_93_loci.pdf'
      - 'output/pdf/svbyeye/svbyeye_locus_index.tsv'
  pull_request:
    paths:
      - '.github/workflows/assemble_supplementary_materials.yml'
      - 'reproducibility/templates/INV_MS_SupplementaryMaterials_v3.8.final.docx'
      - 'reproducibility/manuscript_sources.json'
      - 'scripts/fetch_manuscript_sources.py'
      - 'scripts/assemble_supplementary_materials.py'
      - 'scripts/export_manuscript_figures.py'
      - 'scripts/annotate_main_figure_2a.py'
      - 'scripts/replace_main_figure_3b.py'
      - 'stats/main_figure_3b.py'
      - 'data/cds_permutation_joint_control.tsv'
      - 'data/per_gene_cds_permutation.tsv'
      - 'scripts/verify_assembled_supplement.py'
      - 'stats/supplementary_inventory.py'
      - 'stats/verify_supplementary_inventory.py'
      - 'stats/svbyeye_supplement.py'
      - 'svbyeye/bin/plot_chimp_hires.R'
      - 'data/inv_properties.tsv'
      - 'data/chimp_alignment_responses.json'
      - 'simulations/refsim/make_demography_fig.py'
      - 'simulations/refsim/refsim.py'
      - 'simulations/refsim/gene_flux_fpr_power.png'
      - 'simulations/refsim/gene_flux_fpr_power.pdf'

permissions:
  contents: read

concurrency:
  group: supplementary-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            python-docx==1.2.0 pymupdf==1.26.4 pillow==11.3.0 \
            pypdf==5.9.0 reportlab==4.4.3 numpy==2.2.6 pandas==2.3.3 scipy==1.15.3 \
            statsmodels==0.14.5 matplotlib==3.10.3 \
            demes==0.2.3 demesdraw==0.4.1 msprime==1.4.2

      - name: Install Word rendering stack and manuscript fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          echo msttcorefonts msttcorefonts/accepted-mscorefonts-eula select true \
            | sudo debconf-set-selections
          sudo apt-get install -y \
            libreoffice-writer poppler-utils fonts-liberation2 \
            ttf-mscorefonts-installer
          fc-cache -f
          fc-match -f '%{family}\n' 'Times New Roman' | head -1 \
            | grep -qi 'Times New Roman'

      - name: Verify immutable template and canonical inventory
        run: |
          set -euo pipefail
          python scripts/fetch_manuscript_sources.py \
            --source supplementary_materials_template \
            --source svbyeye_consensus_93_boxed_bundle \
            --output-dir "$RUNNER_TEMP/manuscript-sources"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/manuscript-sources/INV.MS-MainText.v3.7.1.final.1.docx" \
            https://github.com/SauersML/ferromic/releases/download/manuscript-analysis-sources-v3/INV.MS-MainText.v3.7.1.final.1.docx
          echo '2f9274bca277fa4a401408982436f0671c98ecb749b974cc420c4a0a5097d17c  INV.MS-MainText.v3.7.1.final.1.docx' \
            | (cd "$RUNNER_TEMP/manuscript-sources" && sha256sum --check --strict)
          mkdir -p .svbyeye-consensus-93
          tar -xzf \
            "$RUNNER_TEMP/manuscript-sources/svbyeye-consensus-93-boxed.tar.gz" \
            --no-same-owner --no-same-permissions \
            -C .svbyeye-consensus-93
          test -s .svbyeye-consensus-93/manifest.tsv
          test -s .svbyeye-consensus-93/provenance.json
          test "$(find .svbyeye-consensus-93/plots -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 93
          python stats/verify_supplementary_inventory.py \
            --write-tsv output/supplementary_materials/supplementary_inventory.tsv

      - name: Rebuild revision figure assets from their recorded tables
        run: |
          set -euo pipefail
          rm -f -- \
            output/pdf/svbyeye/Supplemental_File_SVbyEye_all_292_loci.pdf \
            output/pdf/svbyeye/Supplemental_File_SVbyEye_all_292_loci_legend.txt
          (cd data && python ../stats/four_fold_pi.py --from-table)
          python stats/recurrence_sd_figure.py
          (cd data && python ../stats/divergence_da_dxy_by_type.py)
          python stats/figure2a_repolarized.py
          python stats/imputation_benchmark_figure.py
          python stats/phewas_within_ancestry_figures.py
          python stats/tag_vs_imputed_concordance.py
          python stats/svbyeye_supplement.py
          python simulations/refsim/make_demography_fig.py \
            --out simulations/refsim/gene_flux_model.png

      - name: Verify every figure input and the 47-page paired alignment source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          import sys

          sys.path.insert(0, 'stats')
          from supplementary_inventory import FINAL_SUPPLEMENTARY_FIGURES

          for figure in FINAL_SUPPLEMENTARY_FIGURES:
              if figure.asset:
                  path = Path(figure.asset)
                  assert path.is_file() and path.stat().st_size > 0, path
                  with Image.open(path) as image:
                      image.verify()
          source = Path(
              'output/pdf/svbyeye/Supplemental_File_SVbyEye_consensus_93_loci.pdf'
          )
          pages = PdfReader(source).pages
          assert len(pages) == 47
          page_sizes = {
              (float(page.mediabox.width), float(page.mediabox.height))
              for page in pages
          }
          assert len(page_sizes) == 1, f'mixed SVbyEye page sizes: {page_sizes}'
          source_plot = next(Path('.svbyeye-consensus-93/plots').glob('*.pdf'))
          source_page = PdfReader(source_plot).pages[0]
          expected_size = (
              float(source_page.mediabox.width),
              2 * float(source_page.mediabox.height),
          )
          assert page_sizes == {expected_size}, (page_sizes, expected_size)
          print(f'paired SVbyEye PDF page size (points): {expected_size}')
          PY

      - name: Assemble and structurally validate the new DOCX
        run: |
          set -euo pipefail
          python scripts/assemble_supplementary_materials.py
          python scripts/verify_assembled_supplement.py \
            output/supplementary_materials/Supplementary_Materials_final.docx

      - name: Render the assembled DOCX to PDF
        run: |
          set -euo pipefail
          mkdir -p output/supplementary_materials/rendered
          libreoffice --headless --convert-to pdf \
            --outdir output/supplementary_materials \
            output/supplementary_materials/Supplementary_Materials_final.docx
          test -s output/supplementary_materials/Supplementary_Materials_final.pdf
          pdfinfo output/supplementary_materials/Supplementary_Materials_final.pdf \
            > output/supplementary_materials/render_audit.txt
          pdftoppm -png -r 90 \
            output/supplementary_materials/Supplementary_Materials_final.pdf \
            output/supplementary_materials/rendered/page

      - name: Export every numbered main and supplementary figure as PDF
        run: |
          set -euo pipefail
          supplementary_count="$(python - <<'PY'
          import sys
          sys.path.insert(0, 'stats')
          from supplementary_inventory import FINAL_SUPPLEMENTARY_FIGURES
          print(len(FINAL_SUPPLEMENTARY_FIGURES))
          PY
          )"
          test "$supplementary_count" -eq 23
          python scripts/export_manuscript_figures.py \
            --main "$RUNNER_TEMP/manuscript-sources/INV.MS-MainText.v3.7.1.final.1.docx" \
            --supplement output/supplementary_materials/Supplementary_Materials_final.docx \
            --output-dir output/manuscript_figures/all_figures_pdf \
            --supplementary-count "$supplementary_count" \
            --expected-base-main-figure-3-sha256 fe073af00fc0aaae5dd7b7d7ae6c2d20a2e9313b8e6025781f3bd46d6dcc89a5
          python scripts/annotate_main_figure_2a.py \
            --base output/manuscript_figures/all_figures_pdf/Figure_2.pdf \
            --output "$RUNNER_TEMP/Figure_2.annotated.pdf"
          mv "$RUNNER_TEMP/Figure_2.annotated.pdf" \
            output/manuscript_figures/all_figures_pdf/Figure_2.pdf
          python stats/main_figure_3b.py \
            --output output/manuscript_figures/all_figures_pdf/Figure_3B.pdf
          python stats/main_figure_3b.py \
            --output "$RUNNER_TEMP/Figure_3B.composite.pdf" \
            --composite
          python scripts/replace_main_figure_3b.py \
            --base output/manuscript_figures/all_figures_pdf/Figure_3.pdf \
            --panel-b "$RUNNER_TEMP/Figure_3B.composite.pdf" \
            --output "$RUNNER_TEMP/Figure_3.corrected.pdf"
          mv "$RUNNER_TEMP/Figure_3.corrected.pdf" \
            output/manuscript_figures/all_figures_pdf/Figure_3.pdf
          # Replace the raster exports of the revision figures with the vector
          # PDFs their scripts wrote in the rebuild step above. Each override is
          # keyed by the inventory entry, not by number, so renumbering the
          # supplement cannot point an override at the wrong figure; the page
          # shape must match the raster export it replaces.
          python - <<'PY'
          import shutil, sys
          from pathlib import Path
          from pypdf import PdfReader
          sys.path.insert(0, 'stats')
          from supplementary_inventory import FINAL_SUPPLEMENTARY_FIGURES

          vector = {
              'gene_flux_model': 'simulations/refsim/gene_flux_model.pdf',
              'gene_flux_performance': 'simulations/refsim/gene_flux_fpr_power.pdf',
              'four_fold_diversity': 'data/four_fold_pi.pdf',
              'ancestral_derived_diversity':
                  'results/figure2a_repolarized/figure2a_repolarized.pdf',
              'genomic_architecture_controls': 'data/recurrence_controls.pdf',
              'divergence': 'data/divergence_fst_dxy_da_by_type.pdf',
              'within_ancestry_pc':
                  'results/phewas_within_ancestry/effect_pvalue_correspondence.pdf',
              'tagging_snp_concordance': 'data/tag_vs_imputed_concordance.pdf',
              'cds_test_calibration_power': 'data/cds_permutation_calibration_power.pdf',
          }
          out = Path('output/manuscript_figures/all_figures_pdf')
          numbers = {figure.key: figure.number for figure in FINAL_SUPPLEMENTARY_FIGURES}
          missing = sorted(set(vector) - set(numbers))
          assert not missing, f'vector overrides name unknown inventory keys: {missing}'
          for key, source in vector.items():
              source = Path(source)
              assert source.is_file() and source.stat().st_size > 0, source
              target = out / f'Figure_S{numbers[key]}.pdf'
              assert target.is_file(), target
              def shape(path):
                  box = PdfReader(path).pages[0].mediabox
                  return float(box.width) / float(box.height)
              raster, vec = shape(target), shape(source)
              assert abs(raster - vec) / raster < 0.10, (key, target, raster, vec)
              shutil.copyfile(source, target)
              print(f'S{numbers[key]:<3} {key:<32} <- {source}')
          PY
          rm output/manuscript_figures/all_figures_pdf/manifest.tsv
          test "$(find output/manuscript_figures/all_figures_pdf -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 28

      - name: Verify every rendered page and make contact sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw
          from pypdf import PdfReader

          root = Path('output/supplementary_materials')
          pdf = root / 'Supplementary_Materials_final.pdf'
          pages = sorted((root / 'rendered').glob('page-*.png'))
          expected = len(PdfReader(pdf).pages)
          page_sizes = {
              (float(page.mediabox.width), float(page.mediabox.height))
              for page in PdfReader(pdf).pages
          }
          assert len(page_sizes) == 1, f'mixed rendered page sizes: {page_sizes}'
          page_width, page_height = next(iter(page_sizes))
          assert page_width < page_height, (
              f'assembled supplement is not portrait: {(page_width, page_height)}'
          )
          print(f'assembled supplement PDF page size (points): {(page_width, page_height)}')
          assert len(pages) == expected
          assert 67 <= expected < 113

          thumbnails = []
          for page in pages:
              with Image.open(page).convert('RGB') as image:
                  background = Image.new('RGB', image.size, 'white')
                  bbox = ImageChops.difference(image, background).getbbox()
                  assert bbox is not None, f'blank rendered page: {page}'
                  thumb = image.copy()
                  thumb.thumbnail((220, 170))
                  thumbnails.append((page.name, thumb))

          per_sheet = 24
          for offset in range(0, len(thumbnails), per_sheet):
              chunk = thumbnails[offset:offset + per_sheet]
              sheet = Image.new('RGB', (6 * 240, 4 * 200), 'white')
              draw = ImageDraw.Draw(sheet)
              for cell, (name, thumb) in enumerate(chunk):
                  x = (cell % 6) * 240
                  y = (cell // 6) * 200
                  sheet.paste(thumb, (x + 10, y + 20))
                  draw.text((x + 10, y + 4), name, fill='black')
              sheet.save(root / f'contact_sheet_{offset // per_sheet + 1:02d}.jpg', quality=90)
          with (root / 'render_audit.txt').open('a') as handle:
              handle.write(f'\nRendered pages checked: {len(pages)}\n')
              handle.write('Blank pages: 0\n')
          PY

      - name: Upload assembled manuscript materials and every figure PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-materials-final
          path: |
            output/manuscript_figures/all_figures_pdf/
            output/supplementary_materials/Supplementary_Materials_final.docx
            output/supplementary_materials/Supplementary_Materials_final.pdf
            output/supplementary_materials/supplementary_inventory.tsv
            output/supplementary_materials/render_audit.txt
            output/supplementary_materials/contact_sheet_*.jpg
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.pdf
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.png
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples_legend.txt
            output/pdf/svbyeye/Supplemental_File_SVbyEye_consensus_93_loci.pdf
            output/pdf/svbyeye/Supplemental_File_SVbyEye_consensus_93_loci_legend.txt
            output/pdf/svbyeye/svbyeye_locus_index.tsv
          if-no-files-found: error
