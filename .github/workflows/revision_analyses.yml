name: Revision Analyses

# Regenerates every analysis added or corrected for the manuscript revision and
# commits the resulting tables back. External source files are immutable release
# assets whose SHA-256 digests are recorded in
# reproducibility/manuscript_sources.json.
#
# The coalescent grid lives in its own workflow (refsim_simulations.yml) because it
# is sharded across a matrix; the AGES multi-SNP check is a second job here because
# it needs a 1.8 GB download and should not block the fast tables.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revision_analyses.yml'
      - 'reproducibility/manuscript_sources.json'
      - 'scripts/fetch_manuscript_sources.py'
      - 'stats/**'
      - 'cds/pipeline_lib.py'
      - 'data/inv_properties.tsv'
      - 'data/cds_identical_proportions.tsv'
      - 'data/GRAND_PAML_RESULTS.tsv'
      - 'data/four_fold_pi_by_inversion.tsv'
      - 'data/pin_pis_by_inversion.tsv'
      - 'data/output.csv'
      - 'data/per_site_diversity_output.falsta.gz'
      - 'data/per_site_fst_output.falsta.gz'
      - 'data/chimp_alignment_responses.json'
      - 'web/figures-site/public/inversions/img/**'
  pull_request:
    paths:
      - '.github/workflows/revision_analyses.yml'
      - 'reproducibility/manuscript_sources.json'
      - 'scripts/fetch_manuscript_sources.py'
      - 'stats/**'

concurrency:
  group: revision-analyses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  svbyeye-supplement:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow pymupdf pypdf reportlab

      - name: Fetch and verify pinned SVbyEye plots
        run: |
          python scripts/fetch_manuscript_sources.py \
            --source svbyeye_chr8_vector \
            --source svbyeye_chr12_vector \
            --source svbyeye_chr15_vector \
            --source svbyeye_chr17_vector \
            --output-dir .svbyeye-preview

      - name: Build and verify SVbyEye supplement
        run: |
          python stats/svbyeye_supplement.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader

          output = Path("output/pdf/svbyeye")
          example = output / "Supplemental_Figure_SVbyEye_orientation_examples.pdf"
          supplement = output / "Supplemental_File_SVbyEye_all_292_loci.pdf"
          image = output / "Supplemental_Figure_SVbyEye_orientation_examples.png"
          index = output / "svbyeye_locus_index.tsv"

          assert len(PdfReader(example).pages) == 1
          assert len(PdfReader(supplement).pages) == 303
          assert sum(1 for _ in index.open()) == 293
          with Image.open(image) as rendered:
              assert rendered.size == (2700, 2375)
          PY

      - name: Commit and push regenerated SVbyEye supplement
        if: github.event_name != 'pull_request'
        env:
          PUSH_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.pdf
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.png
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples_legend.txt
            output/pdf/svbyeye/Supplemental_File_SVbyEye_all_292_loci.pdf
            output/pdf/svbyeye/Supplemental_File_SVbyEye_all_292_loci_legend.txt
            output/pdf/svbyeye/svbyeye_locus_index.tsv
          )
          for f in "${files[@]}"; do
            test -f "$f"
            git add -- "$f"
          done

          if git diff --staged --quiet; then
            echo "SVbyEye supplement is current."
            exit 0
          fi

          git commit -m "Regenerate SVbyEye supplement [skip ci]"
          git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
            --rebase --autostash --strategy=recursive -X ours

          for attempt in 1 2 3; do
            if git push https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt); refreshing and retrying"
            git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
              --rebase --autostash --strategy=recursive -X ours
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Upload SVbyEye supplement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svbyeye-supplement
          path: |
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.pdf
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples.png
            output/pdf/svbyeye/Supplemental_Figure_SVbyEye_orientation_examples_legend.txt
            output/pdf/svbyeye/Supplemental_File_SVbyEye_all_292_loci.pdf
            output/pdf/svbyeye/Supplemental_File_SVbyEye_all_292_loci_legend.txt
            output/pdf/svbyeye/svbyeye_locus_index.tsv
          if-no-files-found: error

  regenerate:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 pandas==2.3.3 scipy==1.15.3 \
            statsmodels==0.14.5 matplotlib==3.10.3 \
            xlsxwriter openpyxl pillow pypdf reportlab tqdm

      - name: Fetch and verify immutable external sources
        run: |
          set -euo pipefail
          python scripts/fetch_manuscript_sources.py \
            --source porubsky_freeze4_callset \
            --source cds_phylip_alignments \
            --source beagle_grch38_genetic_map \
            --source ucsc_hg38_cytoband \
            --source inversion_properties \
            --source population_genetics_locus_table \
            --source population_genetics_diversity_track \
            --source population_genetics_fst_track \
            --source cds_metadata \
            --source paml_results \
            --source chimp_orientation_ledger \
            --source tagging_snp_table \
            --output-dir /tmp/manuscript-sources
          cp /tmp/manuscript-sources/phy_outputs.zip phy_outputs.zip

      # --- upstream guard ----------------------------------------------------
      # data/callset.tsv is a committed copy of the freeze-4 inversion genotype
      # table, which is the ground truth for which haplotypes are inverted and
      # which are direct. run_vcf downloads that table fresh from MSI shared
      # space on every run; the committed copy exists so the stats scripts can
      # read genotypes without a network call. A copy that nothing checks can
      # drift from what the alignments were actually built with, so compare them.
      - name: Check the committed callset against the upstream genotype table
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, sys

          def normalize_gt(value):
              # Phase order is irrelevant to every downstream analysis: 0|1 and
              # 1|0 carry the same genotype dosage.  The local callset also adds
              # PAV-supported calls where the public simpleINV table is missing;
              # those additions are allowed, but every non-missing public call
              # must agree.
              raw = (value or "").split("_")[0].replace("/", "|")
              alleles = tuple(sorted(raw.split("|")))
              return None if not alleles or "" in alleles or "." in alleles else alleles

          def load(path):
              with open(path, newline="") as fh:
                  rows = list(csv.DictReader(fh, delimiter="\t"))
              out = {}
              for r in rows:
                  key = (r.get("seqnames"), r.get("start"), r.get("end"))
                  gts = {k: normalize_gt(v) for k, v in r.items()
                         if k and k[:2] in ("HG", "NA")}
                  out[key] = gts
              return out
          up = load("/tmp/manuscript-sources/porubsky_freeze4_callset.tsv")
          loc = load("data/callset.tsv")
          shared = set(up) & set(loc)
          if len(up) != 292 or shared != set(up):
              print(f"::error::expected all 292 public loci in data/callset.tsv; "
                    f"public={len(up)}, shared={len(shared)}")
              sys.exit(1)
          bad = []
          compared = 0
          for key in shared:
              for sample in set(up[key]) & set(loc[key]):
                  if up[key][sample] is None:
                      continue
                  compared += 1
                  if up[key][sample] != loc[key][sample]:
                      bad.append((key, sample, up[key][sample], loc[key][sample]))
          print(f"loci compared: {len(shared)}; non-missing public genotypes: "
                f"{compared}; mismatches: {len(bad)}")
          if bad:
              print("::error::data/callset.tsv disagrees with the upstream genotype table")
              for item in bad[:10]:
                  print("  ", item)
              sys.exit(1)
          print("data/callset.tsv matches the upstream genotype table")
          PY

      # --- ground-truth guard ------------------------------------------------
      # data/four_fold_pi_by_inversion.tsv and data/pin_pis_by_inversion.tsv are
      # DERIVED from the per-CDS haplotype alignments, which are in turn derived
      # by run_vcf from the freeze-4 inversion genotype table. They are committed
      # only as a cache, because recomputing them needs the alignments.
      #
      # A cache that nothing verifies is a cache that silently rots: the June 2026
      # polarization cutover transposed the direct and inverted columns in place,
      # the July restore fixed only part of it, and every downstream artifact was
      # rebuilt from the broken cache for weeks. The guard that was supposed to
      # catch this asked "which commit last touched the file" -- a provenance
      # question -- so the partial-restore commit disarmed it permanently.
      #
      # This step asks the only question that cannot be fooled: recompute both
      # tables from the alignments and compare. If they differ, the cache is
      # stale and the run fails rather than propagating it.
      - name: Rebuild the derived tables from the alignments and compare
        run: |
          set -euo pipefail
          mkdir -p /tmp/cached
          cp data/four_fold_pi_by_inversion.tsv data/pin_pis_by_inversion.tsv /tmp/cached/
          python -s stats/four_fold_pi.py
          python -s stats/pin_pis.py
          python - <<'PY'
          import pandas as pd
          from pandas.testing import assert_frame_equal

          for name in ("four_fold_pi_by_inversion.tsv", "pin_pis_by_inversion.tsv"):
              expected = pd.read_csv(f"/tmp/cached/{name}", sep="\t")
              observed = pd.read_csv(f"data/{name}", sep="\t")
              try:
                  assert_frame_equal(
                      expected,
                      observed,
                      check_dtype=False,
                      check_exact=False,
                      rtol=1e-12,
                      atol=1e-15,
                  )
              except AssertionError as exc:
                  raise SystemExit(
                      f"data/{name} differs materially from the alignment-derived table:\n{exc}"
                  )
              print(f"data/{name} matches the alignment-derived table within numeric tolerance")
          PY

      - name: Rebuild CDS-conservation inputs from the same alignments
        run: |
          python stats/rebuild_cds_conservation.py \
            --archive phy_outputs.zip \
            --inv-properties data/inv_properties.tsv \
            --output-dir data

      # --- analyses that answer specific reviewer comments -------------------
      - name: Table S5 exclusion reasons (R2 #5)
        run: python stats/table_s5_exclusion_reasons.py

      - name: Per-gene haplotype counts by orientation
        run: python stats/cds_haplotype_counts.py

      - name: Clade-model omega identifiability (R2 #2)
        run: python stats/paml_extreme_omega_check.py

      - name: 4-fold diversity concordance (R1)
        run: python stats/four_fold_pi_correlations.py

      # --from-table reuses the per-inversion table rather than recomputing it
      # from the alignments. That is correct ONLY because the step above has just
      # proved the table matches the alignments; without that proof it is what let
      # the transposed-column cache survive.
      - name: 4-fold and piN/piS test tables
        working-directory: data
        run: |
          python ../stats/four_fold_pi.py --from-table
          python ../stats/pin_pis.py --from-table

      - name: CDS conservation model + calibration (R2 #1)
        working-directory: data
        run: |
          python ../stats/CDS_identical_model.py
          python ../stats/cds_conservation_calibration.py

      - name: Corrected CDS reanalysis (R2 #1)
        run: python stats/robust_cds_reanalysis.py

      - name: Non-circular SD-architecture recurrence check (R1)
        working-directory: data
        run: python ../stats/recurrence_sd_architecture.py

      - name: Divergence (Dxy / da) by recurrence, and breakpoint decay (R1)
        working-directory: data
        run: |
          python ../stats/divergence_da_dxy_by_type.py
          python ../stats/divergence_edge_decay.py

      - name: Build genomic-architecture covariates from pinned references
        run: |
          python stats/inversion_architecture_covariates.py \
            --refdir /tmp/manuscript-sources \
            --inv data/inv_properties.tsv \
            --out data/inversion_architecture_covariates.tsv

      - name: Recurrence effects conditioned on genomic architecture (R3 #3)
        run: python stats/recurrence_architecture_controls.py

      - name: Build revision figures from regenerated tables
        run: |
          python stats/recurrence_sd_figure.py
          python stats/divergence_decomposition_figure.py
          python stats/figure2a_repolarized.py

      - name: Imputation threshold reconciliation
        run: python stats/imputation_threshold_summary.py

      - name: Breakpoint-decay Spearman variants
        run: python stats/decay_spearman_variants.py

      - name: Rebuild supplementary tables workbook
        run: python stats/generate_tables.py

      # --- reproducibility assertions ---------------------------------------
      # These numbers are quoted in the response letter. If a regeneration moves
      # them, the run must fail rather than silently rewrite the record.
      - name: Assert and inventory the non-PheWAS revision numbers
        run: python stats/verify_revision_outputs.py

      - name: Commit and push regenerated tables
        if: github.event_name != 'pull_request'
        env:
          PUSH_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            data/table_s5_exclusion_reasons.tsv
            data/cds_haplotype_counts.tsv
            data/paml_extreme_omega_check.tsv
            data/four_fold_pi_correlations.tsv
            data/four_fold_pi_tests.tsv
            data/pin_pis_tests.tsv
            data/cds_pairwise_adjusted.tsv
            data/cds_pairwise_nocov.tsv
            data/cds_emm_adjusted.tsv
            data/cds_emm_nocov.tsv
            data/cds_conservation_calibration.tsv
            data/robust_cds_reanalysis_results.tsv
            data/robust_cds_reanalysis_inversion_effects.tsv
            data/robust_cds_reanalysis_power.tsv
            data/robust_cds_reanalysis_report.md
            data/decay_spearman_variants.tsv
            data/imputation_threshold_summary.tsv
            data/divergence_middle_vs_flank.tsv
            data/divergence_edge_decay_spearman.tsv
            data/recurrence_sd_calls.tsv
            data/recurrence_sd_summary.tsv
            data/inversion_architecture_covariates.tsv
            data/recurrence_controls_covariates.tsv
            data/recurrence_controls_summary.tsv
            data/recurrence_controls_legacy_tests.tsv
            data/recurrence_controls.pdf
            data/recurrence_controls.png
            data/revision_claim_audit.tsv
            data/recurrence_sd_figure.png
            data/divergence_decomposition.png
            results/figure2a_repolarized/figure2a_locus_audit.tsv
            results/figure2a_repolarized/figure2a_model_effects.tsv
            results/figure2a_repolarized/figure2a_summary.json
            results/figure2a_repolarized/figure2a_repolarized.pdf
            results/figure2a_repolarized/figure2a_repolarized.png
          )
          for f in "${files[@]}"; do
            test -f "$f"
            git add -- "$f"
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Regenerate revision analyses [skip ci]"
          git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
            --rebase --autostash --strategy=recursive -X ours

          for attempt in 1 2 3; do
            if git push https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt); refreshing and retrying"
            git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
              --rebase --autostash --strategy=recursive -X ours
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Upload regenerated tables as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-analyses
          path: |
            data/table_s5_exclusion_reasons.tsv
            data/cds_haplotype_counts.tsv
            data/paml_extreme_omega_check.tsv
            data/four_fold_pi_correlations.tsv
            data/four_fold_pi_tests.tsv
            data/pin_pis_tests.tsv
            data/cds_*.tsv
            data/robust_cds_reanalysis_*
            data/recurrence_sd_*.tsv
            data/inversion_architecture_covariates.tsv
            data/recurrence_controls_*.tsv
            data/recurrence_controls.pdf
            data/recurrence_controls.png
            data/revision_claim_audit.tsv
            data/recurrence_sd_figure.png
            data/divergence_decomposition.png
            results/figure2a_repolarized/*
            web/figures-site/public/downloads/supplementary_tables.xlsx
          if-no-files-found: error

  ages-multi-snp:
    # Reviewer 2 #9: is the ancient-DNA selection signal specific to one tagging
    # SNP, or carried across the locus? Separate job because it downloads the
    # 1.8 GB AGES summary statistics.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests tqdm

      - name: Fetch and verify the immutable AGES source
        run: |
          python scripts/fetch_manuscript_sources.py \
            --source ages_selection_summary \
            --output-dir /tmp/manuscript-sources

      - name: FinnGen replication of the PheWAS signals (R2 #3)
        run: python stats/finngen_replication.py

      - name: GTEx eQTL evidence at the tagging SNPs
        run: python stats/inversion_eqtl_lookup.py

      - name: AGES selection stats across tagging SNPs
        run: |
          python stats/ages_multi_tag_snps.py \
            --selection /tmp/manuscript-sources/Selection_Summary_Statistics_01OCT2025.tsv.gz

      - name: Assert every locus is sign-coherent once aligned to the inverted allele
        run: |
          python - <<'PY'
          import csv, sys
          rows = [r for r in csv.DictReader(open("data/ages_multi_tag_snps.tsv"), delimiter="\t")
                  if r["in_ages"] == "yes" and r["ages_S_inverted_allele"]]
          bad = []
          for region in sorted({r["region"] for r in rows}):
              strong = [r for r in rows
                        if r["region"] == region and abs(float(r["abs_r"])) >= 0.5]
              if not strong:
                  continue
              signs = {float(r["ages_S_inverted_allele"]) > 0 for r in strong}
              if len(signs) != 1:
                  bad.append(f"{region}: mixed sign across {len(strong)} tags with |r| >= 0.5")
          if bad:
              print("AGES SIGN-COHERENCE CHECK FAILED:")
              for b in bad:
                  print("  -", b)
              sys.exit(1)
          print(f"All loci sign-coherent at |r| >= 0.5 ({len(rows)} SNPs in AGES).")
          PY

      - name: Commit the AGES table
        if: github.event_name != 'pull_request'
        env:
          PUSH_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ages_multi_tag_snps.tsv data/finngen_replication.tsv data/inversion_eqtl.tsv
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Regenerate AGES multi-tagging-SNP table [skip ci]"
          git pull https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main \
            --rebase --autostash --strategy=recursive -X ours
          git push https://${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ages-and-finngen
          path: |
            data/ages_multi_tag_snps.tsv
            data/finngen_replication.tsv
            data/inversion_eqtl.tsv
          if-no-files-found: error
